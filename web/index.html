<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<title>Danbooru Tag Index — twenty years of anime tag popularity</title>

<!-- The page renders from a binary the crawler will not parse, so everything a
     crawler gets has to be here. Absolute URLs throughout: og:image is fetched
     by servers that have no page to resolve a relative path against. -->
<meta name="description" content="Monthly popularity for 76,000 Danbooru tags since 2005: raw posts, share of the site, and a fragmentation-adjusted index. Searchable in Chinese, Japanese, English and Korean.">
<link rel="canonical" href="https://jannchie.github.io/danbooru-tag-index/">
<meta property="og:type" content="website">

<meta property="og:description" content="Twenty years of anime tag popularity, month by month. 76,000 tags, three normalisations, five languages.">
<meta property="og:image" content="https://jannchie.github.io/danbooru-tag-index/og.png">
<meta property="og:image:width" content="1200">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Danbooru Tag Index",
  "description": "Monthly post counts for every Danbooru tag above 100 lifetime posts, from 2005-05 onwards, normalised three ways: raw posts, share of all posts, and a within-category index adjusted for how fragmented the category has become.",
  "url": "https://jannchie.github.io/danbooru-tag-index/",
  "temporalCoverage": "2005-05/..",
  "creator": { "@type": "Person", "name": "Jianqi Pan" },
  "isBasedOn": "https://danbooru.donmai.us/",
  "keywords": ["danbooru", "anime", "tag popularity", "trends", "time series"],
  "variableMeasured": ["posts per month", "share per 10000 posts", "relative index vs typical tag in category"]
}
</script>
<style>
  /* Inter, subset to Latin and self-hosted -- 69 KB for the whole 400-700 axis.
     `swap` is the point: text paints immediately in the system face and is
     restyled when the file lands, so the font can never delay a first render.
     Latin only, deliberately. A CJK webfont is megabytes, and the system CJK
     faces are both better hinted for their scripts and already resident. SIL
     OFL 1.1 -- see fonts/LICENSE-Inter.txt. */
  @font-face {
    font-family: "Inter var";
    src: url("fonts/inter.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }

  /* One declaration per token: light-dark() resolves against color-scheme, so
     the palette has a single source and the theme toggle only flips a scheme. */
  :root {
    color-scheme: light dark;
    --latin: "Inter var", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    /* Simplified is the default only because it is the most likely visitor;
       every language overrides it below. */
    --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    --surface-0: light-dark(#f4f3f0, #131312);
    --surface-1: light-dark(#fcfcfb, #1a1a19);
    --surface-2: light-dark(#eceae5, #232322);
    --hairline: light-dark(#dedbd4, #333331);
    --hairline-strong: light-dark(#c6c2b8, #4a4a47);
    --text-primary: light-dark(#0b0b0b, #ffffff);
    --text-secondary: light-dark(#52514e, #c3c2b7);
    --text-muted: light-dark(#78766f, #8d8c84);
    --accent: light-dark(#2a78d6, #3987e5);
    --shadow: light-dark(rgba(0,0,0,.13), rgba(0,0,0,.5));
    /* Validated categorical palette, both modes (see references/palette.md). */
    --s0: light-dark(#2a78d6, #3987e5);
    --s1: light-dark(#eb6834, #d95926);
    --s2: light-dark(#1baf7a, #199e70);
    --s3: light-dark(#eda100, #c98500);
    --s4: light-dark(#e87ba4, #d55181);
    --s5: light-dark(#008300, #008300);
    --s6: light-dark(#4a3aa7, #9085e9);
    --s7: light-dark(#e34948, #e66767);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  /* A class rule's `display` outranks the UA stylesheet's [hidden] { display: none },
     so every hideable element below needs this to actually hide. */
  [hidden] { display: none !important; }
  /* Han unification means one codepoint, several correct shapes: 直 and 骨 are
     drawn differently in Chinese, Japanese and Korean type. A single stack would
     render one of those audiences' text in another's letterforms, so the stack
     follows the UI language, which `html[lang]` already tracks. Every face here
     ships with some OS -- Noto is the Linux entry, not a download. */
  html[lang="zh-tw"] { --cjk: "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "Source Han Sans TC", "Noto Sans CJK TC", "Noto Sans TC", sans-serif; }
  html[lang="ja-jp"] { --cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "Source Han Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  html[lang="ko-kr"] { --cjk: "Apple SD Gothic Neo", "Malgun Gothic", "Source Han Sans K", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; }
  /* An English reader still meets Japanese tag names, so the fallback keeps a
     Han face -- just not one that claims a script the reader did not choose. */
  html[lang="en-us"] { --cjk: "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei UI", "Noto Sans CJK JP", sans-serif; }

  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface-0);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.45;
    font-family: var(--latin), var(--cjk);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, select, input { font: inherit; font-variant-numeric: tabular-nums; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- top bar: title, search and settings on one line ---- */
  .bar {
    display: flex; align-items: center; gap: 10px; flex: none;
    padding: 10px 14px; flex-wrap: wrap;
  }
  h1 { font-size: 14.5px; font-weight: 620; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
  .meta { color: var(--text-muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stamp { color: var(--text-muted); font-size: 11.5px; white-space: nowrap; flex: none; }
  .meta:empty, .stamp:empty { display: none; }
  .btn {
    background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 5px 8px; cursor: pointer; color: var(--text-secondary); font-size: 12px; flex: none;
  }
  .btn:hover { border-color: var(--hairline-strong); color: var(--text-primary); }
  /* An icon has no baseline to sit on, so the box has to do the centring that
     line-height did for a glyph. select.btn keeps the native control's layout. */
  a.btn, button.btn { display: inline-flex; align-items: center; justify-content: center; padding: 5px 6px; }
  .btn svg { display: block; width: 15px; height: 15px; }

  /* ---- search ---- */
  .find { flex: 1 1 240px; position: relative; min-width: 0; }
  #q {
    width: 100%; background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: 7px; padding: 7px 11px; font-size: 14px;
  }
  #q::placeholder { color: var(--text-muted); }
  #q:focus { border-color: var(--accent); outline: none; }
  .suggest {
    position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 5px);
    background: var(--surface-1); border: 1px solid var(--hairline-strong); border-radius: 8px;
    box-shadow: 0 6px 24px var(--shadow); max-height: min(46vh, 380px); overflow-y: auto;
    overscroll-behavior: contain; display: none;
  }
  .suggest.open { display: block; }
  .sug { display: flex; align-items: center; gap: 9px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--hairline); }
  .sug:last-child { border-bottom: 0; }
  .sug[aria-selected="true"], .sug:hover { background: var(--surface-2); }
  .sug .main { flex: 1 1 auto; min-width: 0; }
  .sug .disp, .sug .raw { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug .raw { color: var(--text-muted); font-size: 11.5px; }
  .sug .ct { color: var(--text-muted); font-size: 11.5px; flex: none; }
  mark { background: color-mix(in srgb, var(--accent) 24%, transparent); color: inherit; border-radius: 2px; }
  .cat { font-size: 10.5px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--hairline-strong); color: var(--text-secondary); flex: none; }

  /* ---- one card: controls, readout and chart read as a single instrument ---- */
  .app {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    margin: 0 14px 14px; border: 1px solid var(--hairline); border-radius: 10px;
    background: var(--surface-1); overflow: hidden;
  }
  .main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* ---- saved and preset comparisons ---- */
  .side { display: flex; flex-direction: column; min-height: 0; }
  .side-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .preset {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .preset:hover { background: var(--surface-2); }
  .preset-go {
    flex: 1 1 auto; min-width: 0; border: 0; background: none; cursor: pointer;
    text-align: start; padding: 0; display: flex; flex-direction: column; gap: 1px;
  }
  .preset-go b { font-size: 12.5px; font-weight: 560; color: var(--text-secondary); }
  /* The member tags are the whole reason to pick one preset over another, so
     they are shown rather than hidden behind a hover. */
  .preset-go span {
    font-size: 10.5px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preset:hover .preset-go b { color: var(--text-primary); }
  .preset-del {
    flex: none; border: 0; background: none; cursor: pointer; padding: 2px;
    color: var(--text-muted); display: flex; align-items: center; opacity: 0;
  }
  .preset-del svg { width: 12px; height: 12px; }
  .preset:hover .preset-del, .preset-del:focus-visible { opacity: 1; }
  .side-add, .side-restore {
    flex: none; border: 0; background: none; cursor: pointer; text-align: start;
    padding: 9px 10px; font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 5px;
  }
  .side-add svg { width: 13px; height: 13px; flex: none; }
  .side-add:hover, .side-restore:hover { color: var(--text-primary); background: var(--surface-2); }
  .side-restore { font-size: 11px; padding-top: 0; }

  @media (min-width: 621px) {
    .app { flex-direction: row; }
    .side { order: -1; flex: none; width: 186px; border-right: 1px solid var(--hairline); }
  }

  /* ---- controls: wrap onto more lines rather than scroll options out of sight ---- */
  .ctl {
    flex: none; display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    padding: 9px 11px; border-bottom: 1px solid var(--hairline);
  }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; flex: none; background: var(--surface-1); }
  .seg button {
    border: 0; background: none; padding: 5px 10px; cursor: pointer; color: var(--text-secondary);
    font-size: 12.5px; border-right: 1px solid var(--hairline); white-space: nowrap;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); font-weight: 560; }

  /* Smoothing is continuous, so it gets a slider: the three presets read as inert
     because the trend is preserved by design and only spikes move, whereas dragging
     shows the effect as it happens. */
  .slide {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 9px 3px 10px;
    font-size: 12.5px; color: var(--text-muted); background: var(--surface-1);
  }
  .slide b { color: var(--text-primary); font-weight: 560; min-width: 3.6em; text-align: right; }
  .slide input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 96px; height: 16px;
    background: none; cursor: pointer; margin: 0;
  }
  .slide input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--hairline-strong);
  }
  .slide input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--hairline-strong); }
  .slide input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; margin-top: -5px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--surface-1);
  }
  .slide input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--surface-1);
  }

  /* ---- plot ---- */
  .plot { flex: 1 1 auto; min-height: 0; position: relative; padding: 4px 6px 2px; }
  #chart { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Recessive chrome: solid hairlines one shade off the surface. Dashes read as
     "threshold" or "projection" and add noise to something that is just a grid. */
  .grid line { stroke: var(--hairline); stroke-width: 1; shape-rendering: crispEdges; }
  .grid line.base { stroke: var(--hairline-strong); }
  .axis text { fill: var(--text-muted); font-size: 10.5px; }
  /* Tick values sit on their gridline, haloed so the rule reads through cleanly. */
  .axis text.tick { paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
  .serie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .band { stroke: none; fill-opacity: .13; }
  .tipdot { stroke: var(--surface-1); stroke-width: 1.5; }
  .endlabel { font-size: 11.5px; font-weight: 560; paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
  .crosshair { stroke: var(--hairline-strong); stroke-width: 1; shape-rendering: crispEdges; }
  .dot { stroke: var(--surface-1); stroke-width: 2; }
  .hint { fill: var(--text-muted); font-size: 13px; }

  /* ---- readout: selection, legend and value display in one control ---- */
  .readout {
    flex: none; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: stretch; gap: 0; max-height: 33dvh;
  }
  .when {
    flex: none; display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 8px 12px; border-right: 1px solid var(--hairline); min-width: 96px;
  }
  .when b { font-size: 13px; font-weight: 620; }
  .when span { font-size: 10.5px; color: var(--text-muted); }
  .series {
    flex: 1 1 auto; display: grid; gap: 1px 0; padding: 6px 8px; overflow-y: auto;
    overscroll-behavior: contain; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  .s {
    display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 5px;
    cursor: pointer; min-width: 0;
  }
  .s:hover { background: var(--surface-2); }
  .s.off { opacity: .42; }
  .s .k { width: 14px; height: 2.5px; border-radius: 2px; flex: none; }
  .s .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-secondary); }
  .s .v { font-size: 12.5px; font-weight: 620; flex: none; }
  .s .x { border: 0; background: none; color: var(--text-muted); cursor: pointer; padding: 0; flex: none; display: flex; align-items: center; }
  .s .x svg { width: 13px; height: 13px; }
  .s .x:hover { color: var(--text-primary); }
  /* The category stacks under the name rather than sitting beside it: on one
     line it competed with the value for the row's only free width, and a badge
     outline around it made a secondary label look like a control. */
  .s .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .s .sub { font-size: 10px; color: var(--text-muted); }
  .empty { color: var(--text-muted); font-size: 12.5px; padding: 10px 6px; }

  /* ---- boot ---- */
  .boot { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: var(--text-muted); }
  .bar-p { width: min(280px, 70vw); height: 2px; background: var(--surface-2); border-radius: 1px; overflow: hidden; }
  .bar-p > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .12s; }
  .err { color: light-dark(#e34948, #e66767); }
  .note { font-size: 11.5px; line-height: 1.6; max-width: 46ch; }

  /* The control row scrolls sideways on narrow screens; fade its right edge so
     it is visibly scrollable rather than looking clipped. */
  @media (max-width: 620px) {
    .bar { padding: 8px 10px; gap: 7px; row-gap: 8px; }
    h1 { font-size: 13.5px; flex: 1 1 auto; }
    .meta { display: none; }
    .btn, select.btn { padding: 5px 7px; font-size: 11.5px; }
    /* Search drops to its own full-width line; 16px keeps iOS from zooming in. */
    .find { flex: 1 0 100%; order: 3; }
    #q { padding: 9px 11px; font-size: 16px; }
    .suggest { max-height: 44dvh; }
    .sug { padding: 9px 11px; }
    .app { margin: 0; border-radius: 0; border-left: 0; border-right: 0; }
    .ctl { padding: 8px 9px; gap: 6px; row-gap: 7px; }
    .seg button { padding: 6px 9px; font-size: 12px; }
    .when { min-width: 72px; padding: 6px 9px; }
    .when b { font-size: 12.5px; }
    .series { grid-template-columns: 1fr 1fr; padding: 5px 6px; align-content: start; }
    .s { padding: 5px; gap: 6px; }
    .s .n, .s .v { font-size: 12px; }
    .plot { padding: 4px 3px 2px; }

    /* A time series wants to be wider than tall. Left to fill a portrait phone
       the plot lands near a 0.8 aspect, which reads as steep and cramped, so it
       is capped -- the cap is what frees the room below it. That room used to go
       to the readout, which drew a 200px panel around 60px of labels; it goes to
       the comparison list now, which is content rather than a stretched box. */
    .plot { flex: 0 0 auto; height: min(42dvh, 68vw); }
    .readout { flex: none; max-height: 34dvh; }
    .app { flex: 1 1 auto; border-bottom: 1px solid var(--hairline); border-radius: 0 0 10px 10px; margin-bottom: 14px; }
    .main { flex: none; }
    .side { flex: 1 1 auto; border-top: 1px solid var(--hairline); }
    .preset { padding: 9px 11px; }
    /* No hover on a touch screen, so the delete control cannot hide behind one. */
    .preset-del { opacity: 1; padding: 4px; }
    .preset-del svg { width: 14px; height: 14px; }
  }
  @media (max-width: 480px) {
    /* The date is what tips the bar onto a second row; the controls that do
       something come first. It stays reachable in the page's metadata. */
    .stamp { display: none; }
  }
  @media (max-width: 380px) {
    .series { grid-template-columns: 1fr; }
  }
  /* Landscape phones: vertical space is the scarce axis, so shed chrome height. */
  @media (max-height: 520px) {
    .bar { padding: 6px 10px; }
    #q { padding: 6px 10px; }
    .ctl { padding: 6px 9px; }
    .readout { max-height: 40dvh; }
    .series { padding: 4px 6px; }
    .plot { flex: 1 1 auto; height: auto; }
  }
</style>
</head>
<body>
  <div class="bar">
    <h1 id="t-title">Danbooru Tag Index</h1>
    <div class="find" id="find" hidden>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="suggest">
      <div class="suggest" id="suggest" role="listbox"></div>
    </div>
    <span class="meta" id="meta"></span>
    <span class="stamp" id="stamp"></span>
    <a class="btn" id="repo" href="https://github.com/Jannchie/danbooru-tag-index" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"></a>
    <select class="btn" id="lang" aria-label="Language">
      <option value="zh_hans">简体</option>
      <option value="zh_hant">繁體</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
    </select>
    <button class="btn" id="theme" aria-label="Theme"></button>
  </div>

  <div class="boot" id="boot">
    <span id="t-loading">Loading…</span>
    <div class="bar-p"><i id="bootbar"></i></div>
  </div>

  <div class="app" id="app" hidden>
  <div class="main">
  <div class="ctl" id="ctl">
    <div class="seg" id="metric">
      <button data-v="rel" data-t="rel" aria-pressed="true"></button>
      <button data-v="share" data-t="share" aria-pressed="false"></button>
      <button data-v="posts" data-t="posts" aria-pressed="false"></button>
    </div>
    <label class="slide">
      <span id="t-smooth"></span>
      <input id="smooth" type="range" min="0" max="36" step="1" value="6">
      <b id="smooth-v"></b>
    </label>
    <div class="seg" id="range">
      <button data-v="0" data-t="all" aria-pressed="true"></button>
      <button data-v="120" data-t="y10" aria-pressed="false"></button>
      <button data-v="60" data-t="y5" aria-pressed="false"></button>
      <button data-v="24" data-t="y2" aria-pressed="false"></button>
    </div>

    // cut-off. The exporter decides; charting them would show dips that never happened.

    this.lastComplete = this.dv.getUint16(H.lastComplete, true);

    // the field existed reads 0 -- show nothing rather than invent a date.

    // fragmentation-adjusted metric.

      const nEff = new Float64Array(this.nMonths);

 * category, and HHI contains the tag's own s^2 -- so s/HHI made a tag part of
 * the yardstick it was measured against. That is not a rounding error: once s
 * passes ~7% the self term dominates and s/HHI approaches 1/s, which falls as
 * the tag grows. `original` holds 42% of copyright's HHI and touhou held 83% of
 * it in 2010, both far past the turn. Subtracting s^2 leaves the competitors'
 * HHI and makes the metric monotone again.
 */
function valuesFor(idx) {
  const key = `${idx}|${state.metric}|${state.smooth}`;
  const hit = valueCache.get(key);
  if (hit) return hit;

  const b = state.bundle;
  const run = b.series(idx);
  const first = b.firstMonthOf(idx);
  const n = b.nMonths;
  const raw = new Float64Array(n);
  raw.set(run, first);

  const out = new Float64Array(n);
  // A month's posts is a count, so its sampling noise is Poisson: sd = sqrt(x).
  // `self` is the tag's own weight in whatever denominator normalises it -- a
  // tag that *is* most of its denominator moves the denominator when it moves,
  // which damps the ratio's noise by (1 - self). Ignoring that would overstate
  // the band for `1girl` (72% of all posts) and for a franchise that dominates
  // its category.
  const variance = new Float64Array(n);
  const self = new Float64Array(n);
  if (state.metric === "posts") {
    out.set(raw);
  } else if (state.metric === "share") {
    for (let i = 0; i < n; i++) {
      out[i] = b.totals[i] > 0 ? (raw[i] * 10000) / b.totals[i] : 0;
      self[i] = b.totals[i] > 0 ? raw[i] / b.totals[i] : 0;
    }
  } else {
    const cat = b.cats.get(b.categoryOf(idx));
    if (!cat) {
      for (let i = 0; i < n; i++) {
        out[i] = b.totals[i] > 0 ? (raw[i] * 10000) / b.totals[i] : 0;
        self[i] = b.totals[i] > 0 ? raw[i] / b.totals[i] : 0;
      }
    } else {
      for (let i = 0; i < n; i++) {
        if (!(cat.posts[i] > 0) || !(cat.nEff[i] > 0)) { out[i] = 0; continue; }
        const s = raw[i] / cat.posts[i];
        const rivals = 1 / cat.nEff[i] - s * s;   // the category's HHI, less this tag's own term
        out[i] = rivals > 0 ? s / rivals : 0;     // a lone tag has no competitors to be typical of
        self[i] = s;
      }
    }
  }

  for (let i = 0; i < n; i++) {
    if (!(raw[i] > 0)) continue;
    const sd = (out[i] * (1 - self[i])) / Math.sqrt(raw[i]);
    variance[i] = sd * sd;
  }

  const result = smoothSeries(out, state.smooth, b.firstComplete, b.lastComplete, variance);
  bound(valueCache).set(key, result);
  return result;
}

/**
 * Gaussian-weighted local linear regression (LOESS, degree 1).
 *
 * A moving average is badly biased wherever the window runs off an edge. With
 * only later months available, `1girl`'s first charted month smoothed to 1313
 * against a true 318: the mean of rising data is dragged up by the trend, and
 * shrinking the window does not help because the samples are all on one side.
 * Fitting a local line and reading its value at the centre is unbiased under a
 * linear trend no matter how lopsided the window is.
 *
 * The Gaussian weights are the other half: a boxcar treats a point six months
 * away exactly like the adjacent one, which leaves visible steps. Weighting by
 * distance cuts roughness ~40% and preserves peak heights better (k-on!'s peak
 * survives at 58% rather than 53%).
 *
 * With `varIn` it also returns the standard error of the fitted value. The fit
 * is a linear operator -- v = sum(c_d * y_d) -- so the variances carry through
 * as sum(c_d^2 * var_d), using the same coefficients the fit itself used. That
 * is why the band tightens as the window widens: averaging more months is what
 * buys the precision, and the band should say so.
 */
function smoothSeries(x, w, lo, hi, varIn) {
  if (w <= 1) {
    if (!varIn) return { v: x, se: null };
    const se = new Float64Array(x.length);
    for (let i = lo; i <= hi; i++) se[i] = Math.sqrt(varIn[i]);
    return { v: x, se };
  }
  const sigma = w / 4;
  const rad = Math.max(1, Math.ceil(2 * sigma));
  const kern = new Float64Array(2 * rad + 1);
  for (let d = -rad; d <= rad; d++) kern[d + rad] = Math.exp(-(d * d) / (2 * sigma * sigma));

  const out = new Float64Array(x.length);
  const se = varIn ? new Float64Array(x.length) : null;
  for (let i = lo; i <= hi; i++) {
    let sw = 0, sx = 0, sxx = 0, sy = 0, sxy = 0;
    // Clamped to the complete range: a partial month at either end is excluded
    // from the chart, so letting it into the fit would drag the edge with it.
    const dlo = Math.max(-rad, lo - i), dhi = Math.min(rad, hi - i);
    for (let d = dlo; d <= dhi; d++) {
      const k = kern[d + rad], y = x[i + d];
      sw += k; sx += k * d; sxx += k * d * d; sy += k * y; sxy += k * d * y;
    }
    const den = sw * sxx - sx * sx;
    const flat = Math.abs(den) < 1e-9;   // too few distinct offsets to fit a slope
    const v = flat ? sy / sw : (sxx * sy - sx * sxy) / den;
    out[i] = v > 0 ? v : 0;   // a local line can undershoot; a count cannot be negative
    if (se) {
      let acc = 0;
      for (let d = dlo; d <= dhi; d++) {
        const k = kern[d + rad];
        const c = flat ? k / sw : (k * (sxx - sx * d)) / den;
        acc += c * c * varIn[i + d];
      }
      se[i] = Math.sqrt(acc);
    }
  }
  return { v: out, se };
}

function visibleRange() {
  const { firstComplete: lo, lastComplete: hi } = state.bundle;
  return [state.range > 0 ? Math.max(lo, hi - state.range + 1) : lo, hi];
}
const shownSeries = () => state.picked.filter((p) => !p.hidden);
const unitLabel = () => t(state.metric === "rel" ? "relUnit" : state.metric === "share" ? "shareUnit" : "postsUnit");

function fmtValue(v) {
  if (v === 0) return "0";
  const text = state.metric === "posts"
    ? (v >= 1000 ? fmtInt.format(Math.round(v)) : v.toFixed(v >= 10 ? 0 : 1))
    : state.metric === "rel"
      ? (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(2) : v.toFixed(3))
      : (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2));
  // Anything under the last decimal place formats as "0.000". A log axis that
  // reaches 1e-8 -- which a tag with three posts a month does -- then prints
  // eight identical labels, which is worse than having no axis at all.
  return parseFloat(text) === 0 ? v.toExponential(0) : text;
}

/** Axis ticks are abbreviated: they sit inside the plot and must stay small. */
function fmtTick(v) {
  if (state.metric !== "posts") return fmtValue(v);
  if (v >= 1e6) return +(v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M";
  if (v >= 1e3) return +(v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + "k";
  return String(Math.round(v));
}

// ---------------------------------------------------------------- chart

function niceTicks(lo, hi, target) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm >= 7.5 ? 10 : norm >= 3.5 ? 5 : norm >= 1.5 ? 2 : 1) * mag;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(v);
  return ticks;
}

function logTicks(lo, hi) {
  const ticks = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) {
    for (const m of [1, 2, 5]) {
      const v = m * Math.pow(10, e);
      if (v >= lo * 0.999 && v <= hi * 1.001) ticks.push(v);
    }
  }
  return ticks.length >= 2 ? ticks : [lo, hi];
}

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(name, attrs, parent) {
  const node = document.createElementNS(SVGNS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

function render() {
  const svg = $("chart");
  svg.replaceChildren();
  plotRect = null;

  const box = svg.getBoundingClientRect();
  const width = Math.max(200, Math.round(box.width));
  const height = Math.max(140, Math.round(box.height));
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const shown = shownSeries();
  if (!shown.length) {
    svgEl("text", { class: "hint", x: width / 2, y: height / 2, "text-anchor": "middle" }, svg).textContent = t("empty");
    plot = null;
    updateReadout(null);
    return;
  }

  const [m0, m1] = visibleRange();
  const nVis = m1 - m0 + 1;
  const data = shown.map((p) => {
    const fit = valuesFor(p.idx);
    return { ...p, name: nameOf(p.idx), values: fit.v, se: fit.se };
  });

  // End labels only where there is room for them; the readout carries identity
  // and values at every width, so narrow screens lose nothing.
  const labels = width >= 560;
  const compact = height < 260;
  // Tick values sit *on* the gridlines rather than in a left gutter, which buys
  // back ~45px of plot width -- most of a phone's usable margin.
  const pad = { t: 14, r: labels ? 100 : 10, b: 20, l: 10 };
  const plotW = Math.max(10, width - pad.l - pad.r);
  const plotH = Math.max(10, height - pad.t - pad.b);

  let hi = -Infinity;
  for (const d of data) for (let i = m0; i <= m1; i++) if (d.values[i] > hi) hi = d.values[i];
  if (!isFinite(hi) || hi <= 0) hi = 1;

  const isLog = state.scale === "log";
  let yLo, yHi, ticks;
  if (isLog) {
    let positive = Infinity;
    for (const d of data) for (let i = m0; i <= m1; i++) if (d.values[i] > 0 && d.values[i] < positive) positive = d.values[i];
    if (!isFinite(positive)) positive = 1;
    yLo = Math.pow(10, Math.floor(Math.log10(positive)));
    yHi = Math.pow(10, Math.ceil(Math.log10(Math.max(hi, yLo * 10))));
    ticks = logTicks(yLo, yHi);
  } else {
    yLo = 0;
    ticks = niceTicks(0, hi, compact ? 3 : 5);
    yHi = Math.max(hi, ticks[ticks.length - 1]);
  }

  const x = (i) => pad.l + (nVis === 1 ? plotW / 2 : ((i - m0) / (nVis - 1)) * plotW);
  const y = isLog
    ? (v) => pad.t + plotH - (Math.log10(Math.max(v, yLo) / yLo) / Math.log10(yHi / yLo)) * plotH
    : (v) => pad.t + plotH - ((v - yLo) / (yHi - yLo)) * plotH;

  const grid = svgEl("g", { class: "grid" }, svg);
  const axis = svgEl("g", { class: "axis" }, svg);
  for (const tick of ticks) {
    const yy = Math.round(y(tick)) + 0.5;
    const base = Math.abs(tick - yLo) < 1e-9;
    svgEl("line", { class: base ? "base" : "", x1: pad.l, x2: pad.l + plotW, y1: yy, y2: yy }, grid);
    if (!base || isLog) {
      svgEl("text", { class: "tick", x: pad.l + 1, y: yy - 4 }, axis).textContent = fmtTick(tick);
    }
  }

  const years = [];
  for (let i = m0; i <= m1; i++) { const yr = monthYear(i); if (!years.length || years[years.length - 1].yr !== yr) years.push({ yr, i }); }
  const room = width < 480 ? 44 : 56;
  const stride = Math.max(1, Math.ceil(years.length / Math.max(2, Math.floor(plotW / room))));
  const terse = width < 480 && years.length > 6;
  years.forEach((entry, k) => {
    if (k % stride) return;
    const label = svgEl("text", { x: x(entry.i), y: pad.t + plotH + 14, "text-anchor": "middle" }, axis);
    label.textContent = terse ? "'" + String(entry.yr).slice(2) : entry.yr;
  });

  // 95% bands from counting noise alone, drawn beneath every line so that one
  // series' uncertainty never hides another's value. Half of the copyright tags
  // get under 10 posts a month, where the band is wider than the swings people
  // read as trends -- the chart should say so rather than let a confident-
  // looking 2px line imply precision the count cannot support.
  for (const d of data) {
    if (!d.se) continue;
    const clamp = (v) => Math.max(pad.t, Math.min(pad.t + plotH, y(v))).toFixed(1);
    let seg = [];
    const flush = () => {
      if (seg.length > 1) {
        let path = "";
        for (let k = 0; k < seg.length; k++) path += (k ? "L" : "M") + seg[k][0] + " " + seg[k][1] + " ";
        for (let k = seg.length - 1; k >= 0; k--) path += "L" + seg[k][0] + " " + seg[k][2] + " ";
        svgEl("path", { class: "band", d: path + "Z", fill: `var(--s${d.slot})` }, svg);
      }
      seg = [];
    };
    for (let i = m0; i <= m1; i++) {
      const v = d.values[i];
      if (isLog && v <= 0) { flush(); continue; }   // same break the line takes
      const e = 1.96 * d.se[i];
      seg.push([x(i).toFixed(1), clamp(v + e), clamp(v - e)]);
    }
    flush();
  }

  for (const d of data) {
    let path = "", pen = false;
    for (let i = m0; i <= m1; i++) {
      const v = d.values[i];
      if (isLog && v <= 0) { pen = false; continue; }   // a log axis has no place for zero
      path += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      pen = true;
    }
    svgEl("path", { class: "serie", d: path, stroke: `var(--s${d.slot})` }, svg);
    // A dot on the latest point anchors the eye at "now" and keeps a series
    // that ends flat from vanishing into a gridline.
    const last = d.values[m1];
    if (!(isLog && last <= 0)) {
      svgEl("circle", { class: "tipdot", cx: x(m1), cy: y(last), r: 2.5, fill: `var(--s${d.slot})` }, svg);
    }
  }

  if (labels) {
    const placed = [];
    for (const d of [...data].sort((a, b) => b.values[m1] - a.values[m1])) {
      const v = d.values[m1];
      if (isLog && v <= 0) continue;
      let yy = y(v);
      while (placed.some((p) => Math.abs(p - yy) < 13)) yy += 13;
      placed.push(yy);
      const label = svgEl("text", { class: "endlabel", x: pad.l + plotW + 6, y: Math.min(yy + 4, pad.t + plotH + 4), fill: `var(--s${d.slot})` }, svg);
      label.textContent = d.name.length > 13 ? d.name.slice(0, 12) + "…" : d.name;
    }
  }

  plot = { data, x, y, m0, m1, pad, plotW, plotH, isLog, hover: svgEl("g", {}, svg) };
  updateReadout(state.hoverMonth);
}

// ---------------------------------------------------------------- readout

/** The readout is the selection list, the legend and the value display at once. */
function renderSeriesList() {
  const box = $("series");
  box.replaceChildren();
  if (!state.picked.length) {
    box.appendChild(el("div", "empty", t("empty")));
    return;
  }
  for (const p of state.picked) {
    const row = el("div", "s" + (p.hidden ? " off" : ""));
    row.setAttribute("role", "button");
    row.setAttribute("aria-pressed", String(!p.hidden));
    row.tabIndex = 0;
    const key = el("span", "k");
    key.style.background = `var(--s${p.slot})`;
    const value = el("span", "v", "—");
    value.dataset.slot = String(p.slot);
    const close = el("button", "x");
    close.appendChild(icon("x"));
    close.setAttribute("aria-label", "remove");
    close.onclick = (e) => { e.stopPropagation(); removeTag(p.idx); };
    const toggle = () => { commit(); p.hidden = !p.hidden; renderSeriesList(); render(); };
    row.onclick = toggle;
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    const main = el("span", "main");
    main.append(el("span", "n", nameOf(p.idx)), el("span", "sub", catLabel(p.idx)));
    row.append(key, main, value, close);
    box.appendChild(row);
  }
  if (state.picked.length >= MAX_SERIES) box.appendChild(el("div", "empty", t("limit").replace("{n}", MAX_SERIES)));
}

/** Values at `month`, or at the last complete month when not hovering. */
function updateReadout(month) {
  const rows = $("series").querySelectorAll(".s .v");
  if (!plot) { rows.forEach((r) => (r.textContent = "—")); $("when-m").textContent = "—"; return; }
  const at = month === null ? plot.m1 : month;
  $("when-m").textContent = monthLabel(at);
  $("when-u").textContent = unitLabel();
  const byIdx = new Map(plot.data.map((d) => [d.slot, d.values[at]]));
  rows.forEach((node) => {
    const v = byIdx.get(Number(node.dataset.slot));
    node.textContent = v === undefined ? "—" : fmtValue(v);
  });
}

function onPointer(event) {
  if (!plot) return;
  const svg = $("chart");
  if (!plotRect) plotRect = svg.getBoundingClientRect();
  const px = ((event.clientX - plotRect.left) / plotRect.width) * svg.viewBox.baseVal.width;
  const ratio = (px - plot.pad.l) / plot.plotW;
  const i = Math.max(plot.m0, Math.min(plot.m1, plot.m0 + Math.round(ratio * (plot.m1 - plot.m0))));
  if (i === state.hoverMonth) return;    // ~3 px per month: most moves land on the same one
  state.hoverMonth = i;

  plot.hover.replaceChildren();
  const xx = Math.round(plot.x(i)) + 0.5;
  svgEl("line", { class: "crosshair", x1: xx, x2: xx, y1: plot.pad.t, y2: plot.pad.t + plot.plotH }, plot.hover);
  for (const d of plot.data) {
    const v = d.values[i];
    if (plot.isLog && v <= 0) continue;
    svgEl("circle", { class: "dot", cx: plot.x(i), cy: plot.y(v), r: 4, fill: `var(--s${d.slot})` }, plot.hover);
  }
  updateReadout(i);
}

function clearHover() {
  if (plot) plot.hover.replaceChildren();
  state.hoverMonth = null;
  updateReadout(null);
}

// ---------------------------------------------------------------- picking

function addTag(idx, defer) {
  if (idx < 0 || state.picked.some((p) => p.idx === idx) || state.picked.length >= MAX_SERIES) return;
  if (!defer) commit();   // the seeding loop passes defer, and the initial state is not undoable
  const used = new Set(state.picked.map((p) => p.slot));
  let slot = 0;
  while (used.has(slot) && slot < MAX_SERIES) slot++;
  state.picked.push({ idx, slot, hidden: false });
  if (!defer) { renderSeriesList(); render(); syncHash(); }
}

function removeTag(idx) {
  commit();
  state.picked = state.picked.filter((p) => p.idx !== idx);
  renderSeriesList();
  render();
  syncHash();
}

// ---------------------------------------------------------------- comparisons

const SAVED_KEY = "dbix-saved", HIDDEN_KEY = "dbix-hidden";

function readStore(key) {
  try {
    const parsed = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch { return []; }   // a hand-edited or truncated entry must not break boot
}
const writeStore = (key, value) => localStorage.setItem(key, JSON.stringify(value));

/** Built-ins the reader has dismissed, plus everything they have saved. */
function presets() {
  const hidden = new Set(readStore(HIDDEN_KEY));
  const mine = readStore(SAVED_KEY).map((entry) => ({ ...entry, mine: true }));
  return [...mine, ...BUILTIN.filter((b) => !hidden.has(b.id))];
}

/** A saved set is named by its members, so the name follows the UI language
 *  instead of freezing whatever language it was saved in. */
function presetLabel(preset) {
  if (preset.name) return preset.name[state.lang] || preset.name.en;
  const names = memberNames(preset);
  if (preset.versus) return names.join(" vs ");
  return names.slice(0, 2).join(" · ") || "—";
}

function memberNames(preset) {
  return preset.tags.map((raw) => {
    const idx = state.bundle.findByName(raw);
    return idx >= 0 ? nameOf(idx) : raw;
  });
}

function renderPresets() {
  const list = $("presetlist");
  list.replaceChildren();
  for (const preset of presets()) {
    const row = el("div", "preset");
    const go = el("button", "preset-go");
    const detail = preset.versus ? preset.tags.join(" · ") : memberNames(preset).join(" · ");
    go.append(el("b", "", presetLabel(preset)), el("span", "", detail));
    go.onclick = () => applyPreset(preset);

    const del = el("button", "preset-del");
    del.appendChild(icon("x"));
    del.title = t("del");
    del.setAttribute("aria-label", `${t("del")}: ${presetLabel(preset)}`);
    del.onclick = () => dropPreset(preset);

    row.append(go, del);
    list.appendChild(row);
  }
  $("restoredefaults").hidden = readStore(HIDDEN_KEY).length === 0;
}

/** Replaces the selection and the four chart controls in one undoable step.
 *  Goes through restore() so there is exactly one place that knows how to put
 *  a whole chart state back onto the controls. */
function applyPreset(preset) {
  const picked = preset.tags
    .map((raw) => state.bundle.findByName(raw))
    .filter((idx) => idx >= 0)
    .slice(0, MAX_SERIES)
    .map((idx, slot) => [idx, slot, 0]);
  if (!picked.length) return;
  commit();
  restore(JSON.stringify([picked, preset.metric, preset.scale, preset.smooth, preset.range]));
}

function dropPreset(preset) {
  if (preset.mine) {
    writeStore(SAVED_KEY, readStore(SAVED_KEY).filter((entry) => entry.id !== preset.id));
  } else {
    writeStore(HIDDEN_KEY, [...new Set([...readStore(HIDDEN_KEY), preset.id])]);
  }
  renderPresets();
}

function saveCurrent() {
  if (!state.picked.length) return;
  const entry = {
    id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    tags: state.picked.map((p) => state.bundle.name(p.idx)),
    metric: state.metric, scale: state.scale, smooth: state.smooth, range: state.range,
  };
  writeStore(SAVED_KEY, [entry, ...readStore(SAVED_KEY)]);
  renderPresets();
}

// ---------------------------------------------------------------- search UI

let sugIdx = -1, sugHits = [];

function marked(text, query) {
  const frag = document.createDocumentFragment();
  const at = text.toLowerCase().indexOf(query.toLowerCase());
  if (at < 0 || !query) { frag.appendChild(document.createTextNode(text)); return frag; }
  frag.appendChild(document.createTextNode(text.slice(0, at)));
  frag.append(el("mark", null, text.slice(at, at + query.length)), document.createTextNode(text.slice(at + query.length)));
  return frag;
}

function renderSuggest(query) {
  const box = $("suggest");
  sugHits = query ? state.bundle.search(query) : [];
  sugIdx = -1;
  box.replaceChildren();
  if (!sugHits.length) { box.classList.remove("open"); $("q").setAttribute("aria-expanded", "false"); return; }

  sugHits.forEach((hit, k) => {
    const raw = state.bundle.name(hit.i);
    const display = nameOf(hit.i);
    const row = el("div", "sug");
    row.setAttribute("role", "option");
    const main = el("span", "main");
    const top = el("span", "disp");
    top.appendChild(marked(display, query));
    main.appendChild(top);

    // Show what actually matched when it is not the visible name.
    const secondary = [];
    if (display !== raw) secondary.push(raw);
    if (hit.term && hit.term !== raw.toLowerCase() && hit.term !== display.toLowerCase()) secondary.push(hit.term);
    if (secondary.length) {
      const sub = el("span", "raw");
      sub.appendChild(marked(secondary.join(" · "), query));
      main.appendChild(sub);
    }
    row.append(main, el("span", "cat", catLabel(hit.i) || "tag"), el("span", "ct", fmtInt.format(state.bundle.postCountOf(hit.i))));
    row.onmousedown = (e) => { e.preventDefault(); pick(k); };
    box.appendChild(row);
  });
  box.classList.add("open");
  $("q").setAttribute("aria-expanded", "true");
}

function pick(k) {
  if (k < 0 || k >= sugHits.length) return;
  addTag(sugHits[k].i);
  $("q").value = "";
  renderSuggest("");
  $("q").blur();
}

function highlight(next) {
  const items = $("suggest").querySelectorAll(".sug");
  if (!items.length) return;
  if (sugIdx >= 0) items[sugIdx].setAttribute("aria-selected", "false");
  sugIdx = (next + items.length) % items.length;
  items[sugIdx].setAttribute("aria-selected", "true");
  items[sugIdx].scrollIntoView({ block: "nearest" });
}

// ---------------------------------------------------------------- url + language

function syncHash() {
  const names = state.picked.map((p) => state.bundle.name(p.idx));
  history.replaceState(null, "", location.pathname + location.search + (names.length ? "#" + names.map(encodeURIComponent).join(",") : ""));
}

function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  if (!raw) return [];
  return raw.split(",").map((s) => state.bundle.findByName(s.trim())).filter((i) => i >= 0);
}

function detectLang() {
  const saved = localStorage.getItem("dbix-lang");
  if (saved && UI[saved]) return saved;
  // A language variant page says so in its markup -- the URL already made that
  // choice, and a crawler was served it. The root page carries no marker and
  // falls through to sniffing the browser, which is what x-default means.
  const served = document.querySelector('meta[name="dbix-lang"]')?.content;
  if (served && UI[served]) return served;
  for (const tag of navigator.languages || [navigator.language || "en"]) {
    const lower = tag.toLowerCase();
    if (lower.startsWith("zh")) return /hant|tw|hk|mo/.test(lower) ? "zh_hant" : "zh_hans";
    if (lower.startsWith("ja")) return "ja";
    if (lower.startsWith("ko")) return "ko";
    if (lower.startsWith("en")) return "en";
  }
  return "en";
}

function showSmooth() {
  $("smooth-v").textContent = state.smooth <= 1 ? t("raw") : t("mo").replace("{n}", state.smooth);
}

/** Coverage, totals and provenance. The month range is the charted one --
 *  both ends can be partial, and naming a month the chart does not draw would
 *  claim data that is not there. */
function showMeta() {
  const b = state.bundle;
  if (!b) return;
  const posts = b.totals.slice(b.firstComplete, b.lastComplete + 1).reduce((a, c) => a + c, 0);
  $("meta").textContent = `${fmtInt.format(b.nTags)} ${t("tags")} · ${monthLabel(b.firstComplete)}–${monthLabel(b.lastComplete)} · ${fmtInt.format(posts)} ${t("posts_total")}`;
  $("stamp").textContent = b.built ? `${t("updated")} ${b.built}` : "";
}

function applyLang() {
  fmtInt = new Intl.NumberFormat(LOCALE[state.lang] || "en");
  document.documentElement.lang = (LOCALE[state.lang] || "en").toLowerCase();
  document.title = t("title");
  document.title = t("title");
  $("t-title").textContent = t("title");
  $("t-loading").textContent = t("loading");
  $("t-smooth").textContent = t("smooth");
  $("q").placeholder = t("search");
  showSmooth();
  for (const button of document.querySelectorAll(".seg button")) button.textContent = t(button.dataset.t);
  $("chart").setAttribute("aria-label", t("title"));
  $("side").setAttribute("aria-label", t("presets"));
  $("savecur").replaceChildren(icon("plus"), document.createTextNode(" " + t("save")));
  $("restoredefaults").textContent = t("restore");
  const b = state.bundle;
  if (b) {
    showMeta();
    renderPresets();
    renderSeriesList();
    render();
    if ($("q").value) renderSuggest($("q").value);
  }
}

function applyTheme() {
  if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  else document.documentElement.removeAttribute("data-theme");
}

// ---------------------------------------------------------------- undo/redo

const HISTORY_LIMIT = 100;
const past = [], future = [];
let lastKind = "", lastAt = 0;

/**
 * The undoable slice of state: what the user composed, not their preferences.
 * Theme and UI language stay outside it -- undoing a chart edit should not also
 * flip the page back to dark.
 */
function snapshot() {
  return JSON.stringify([
    state.picked.map((p) => [p.idx, p.slot, p.hidden ? 1 : 0]),
    state.metric, state.scale, state.smooth, state.range,
  ]);
}

function restore(snap) {
  const [picked, metric, scale, smooth, range] = JSON.parse(snap);
  state.picked = picked.map(([idx, slot, hidden]) => ({ idx, slot, hidden: !!hidden }));
  Object.assign(state, { metric, scale, smooth, range });
  for (const id of SEGMENTS) {
    for (const b of $(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === String(state[id])));
  }
  $("smooth").value = String(state.smooth);
  showSmooth();
  renderSeriesList();
  render();
  syncHash();
}

/**
 * Record the pre-change state. `kind` collapses one continuous gesture into a
 * single step: dragging the smoothing slider fires `input` per pixel, and 36
 * undo steps for one drag is not what Ctrl+Z is for.
 */
function commit(kind) {
  const now = Date.now();
  if (kind && kind === lastKind && now - lastAt < 700) { lastAt = now; return; }
  lastKind = kind || "";
  lastAt = now;
  past.push(snapshot());
  if (past.length > HISTORY_LIMIT) past.shift();
  future.length = 0;
}

/** Move one step between the two stacks; undo is (past → future), redo the reverse. */
function step(from, to) {
  if (!from.length) return;
  to.push(snapshot());
  restore(from.pop());
  lastKind = "";
}

// ---------------------------------------------------------------- boot

function segment(id, cast) {
  $(id).addEventListener("click", (e) => {
    const button = e.target.closest("button");
    if (!button) return;
    commit();
    for (const b of $(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b === button));
    state[id] = cast(button.dataset.v);
    render();
  });
}

async function boot() {
  state.lang = detectLang();
  state.theme = localStorage.getItem("dbix-theme") || null;
  $("lang").value = state.lang;
  $("repo").appendChild(icon("github"));
  $("theme").appendChild(icon("contrast"));
  applyTheme();
  applyLang();

  try {
    const res = await fetch(BUNDLE_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const total = Number(res.headers.get("content-length")) || 0;
    let buf;
    if (res.body && total) {
      const reader = res.body.getReader();
      const parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        $("bootbar").style.width = Math.min(100, (got / total) * 100) + "%";
      }
      buf = await new Blob(parts).arrayBuffer();
    } else {
      buf = await res.arrayBuffer();
    }
    state.bundle = new Bundle(buf);
  } catch (err) {
    $("boot").replaceChildren(el("div", "err", t("failed") + err.message), el("div", "note", t("serve")));
    return;
  }

  $("boot").hidden = true;
  for (const id of ["find", "app"]) $(id).hidden = false;

  const fromHash = readHash();
  const seed = fromHash.length ? fromHash : ["hatsune_miku", "genshin_impact", "blue_archive", "kantai_collection"].map((n) => state.bundle.findByName(n));
  seed.slice(0, MAX_SERIES).forEach((i) => addTag(i, true));   // one render after the loop, not four
  syncHash();
  showMeta();   // applyLang ran before the bundle existed; this is its first real chance
  renderPresets();

  $("savecur").onclick = saveCurrent;
  $("restoredefaults").onclick = () => { localStorage.removeItem(HIDDEN_KEY); renderPresets(); };

  const q = $("q");
  let debounce = 0;
  q.addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(() => renderSuggest(q.value), 60); });
  q.addEventListener("focus", () => { if (q.value) renderSuggest(q.value); });
  q.addEventListener("blur", () => setTimeout(() => $("suggest").classList.remove("open"), 140));
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); highlight(sugIdx + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); highlight(sugIdx - 1); }
    else if (e.key === "Enter") { e.preventDefault(); pick(sugIdx >= 0 ? sugIdx : 0); }
    else if (e.key === "Escape") { $("suggest").classList.remove("open"); q.blur(); }
  });

  segment("metric", String);
  segment("scale", String);
  segment("range", Number);

  const smooth = $("smooth");
  smooth.value = String(state.smooth);
  smooth.addEventListener("input", () => {
    commit("smooth");
    state.smooth = Number(smooth.value);
    showSmooth();
    render();
  });

  document.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    // A focused text field owns its own Ctrl+Z; the range input has no native undo.
    if (e.target.matches && e.target.matches("input:not([type=range]), textarea")) return;
    const key = e.key.toLowerCase();
    if (key === "z" && !e.shiftKey) { e.preventDefault(); step(past, future); }
    else if (key === "y" || (key === "z" && e.shiftKey)) { e.preventDefault(); step(future, past); }
  });

  $("lang").addEventListener("change", (e) => {
    state.lang = e.target.value;
    localStorage.setItem("dbix-lang", state.lang);
    applyLang();
  });

  $("theme").onclick = () => {
    const dark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    state.theme = dark ? "light" : "dark";
    localStorage.setItem("dbix-theme", state.theme);
    applyTheme();
    render();
  };

  const svg = $("chart");
  svg.addEventListener("pointerdown", onPointer);
  svg.addEventListener("pointermove", onPointer);
  svg.addEventListener("pointerleave", clearHover);

  // Observe the container, whose size render() does not change -- the svg fills
  // it via CSS, so there is no measure/resize feedback loop.
  let raf = 0, lastW = 0, lastH = 0;
  new ResizeObserver((entries) => {
    const { width, height } = entries[0].contentRect;
    if (Math.round(width) === lastW && Math.round(height) === lastH) return;
    lastW = Math.round(width);
    lastH = Math.round(height);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(render);
  }).observe($("plot"));

  renderSeriesList();
  render();
}

boot();
</script>
</body>
</html>
