name: build

# Stage 2 of the build. Stage 1 needs the 46 GB metadata database and therefore
# runs on the machine that holds it (scripts/refresh.py), publishing a ~75 MB set
# of artifacts to the `data-latest` release. Nothing here opens that database.
on:
  push:
    # Both names: `on.push` cannot take an expression, and this repo is on
    # master while the convention elsewhere is main. The publish gate below
    # compares against the repository's actual default branch.
    branches: [main, master]
  pull_request:
  # Stage 1 fires this after uploading fresh artifacts.
  repository_dispatch:
    types: [data-refreshed]
  workflow_dispatch:
  schedule:
    # Rebuild weekly even without a data refresh, so a broken dependency surfaces
    # on its own rather than during the next data update.
    - cron: "17 4 * * 1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -q

  bundle:
    needs: test
    runs-on: ubuntu-latest
    # A pull request has no business publishing, but it should still prove the
    # bundle builds -- so the job runs and only the deploy step is gated.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Fetch stage-1 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-latest >/dev/null 2>&1; then
            echo "::error::No 'data-latest' release yet. Stage 1 has never published."
            echo "Run scripts/refresh.py on the machine holding the metadata database,"
            echo "then upload its artifacts with the command it prints. See README."
            exit 1
          fi
          mkdir -p data/index
          gh release download data-latest --dir data/index --clobber
          # Named individually, not `*_names.json`: that glob also matches
          # wiki_other_names.json, which belongs in data/index. Moving it away
          # cost 11,634 tags their multilingual search on a green build.
          for f in character_names.json copyright_names.json artist_names.json; do
            mv "data/index/$f" data/translations/
          done
          ls -la data/index data/translations

      - name: Build name maps
        run: uv run python scripts/build_name_map.py

      - name: Build bundle
        run: uv run python scripts/export_index_bundle.py

      - name: Assemble the site
        run: |
          mkdir -p site
          cp web/index.html web/og.png web/robots.txt site/
          cp -r web/fonts site/
          cp data/index/index_bundle.bin data/index/index_bundle.json site/
          # Generated rather than committed: it carries the build date, and a
          # committed one would go stale on every refresh that touches no file.
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://jannchie.github.io/danbooru-tag-index/</loc>\n    <lastmod>%s</lastmod>\n  </url>\n</urlset>\n' "$(date -u +%F)" > site/sitemap.xml
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: bundle
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
